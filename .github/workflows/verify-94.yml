# Verifies the vkmark-94 driver state: the 13 source files that make up the
# batch-merging + single-bag async PanVK build must match their recorded
# fingerprints byte-for-byte, then the driver must compile from scratch.
#
# NOTE on binary identity: the reference binary (md5 d883a28e, vkmark 94)
# was built on-device in Termux. A GitHub runner uses a different toolchain,
# so its .so hash will differ. What this workflow proves instead:
#   1. the checked-out source IS the 94 source (md5sum -c), and
#   2. it builds cleanly (same driver target).
# Same source + same Meson options => same driver behavior.
name: verify-94-build

on:
  push:
    branches: [g57-vkmark-94]
  workflow_dispatch:

jobs:
  verify-94:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            python3 python3-pip python3-mako python3-ply python3-yaml \
            bison flex \
            zlib1g-dev libzstd-dev libexpat1-dev \
            libdrm-dev \
            libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev \
            libxshmfence-dev libxxf86vm-dev \
            libxrandr-dev libxext-dev libxdamage-dev libxfixes-dev

      - name: Install Meson >= 1.4 (Ubuntu archive ships 1.3.x)
        run: |
          sudo pip3 install --break-system-packages -U meson
          meson --version

      - name: Verify 94 source fingerprint
        run: md5sum -c .github/94-checksums.txt

      - name: Configure (PanVK-only, X11, release)
        run: |
          meson setup build-verify \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dplatforms=x11 \
            -Dglx=disabled \
            -Dbuildtype=release \
            -Dtools=[] \
            -Dvideo-codecs=

      - name: Build libvulkan_panfrost
        run: ninja -C build-verify -j"$(nproc)" src/panfrost/vulkan/libvulkan_panfrost.so

      - name: Report artifact hash (informational)
        run: sha256sum build-verify/src/panfrost/vulkan/libvulkan_panfrost.so
