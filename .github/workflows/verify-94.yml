# Builds the vkmark-94 driver exactly as shipped: native aarch64 compile
# inside a Termux userland container (same toolchain class as the on-device
# build that produced the reference binary, md5 d883a28e).
#
# What green means here: the pushed sources match the 94 fingerprint AND
# compile cleanly to libvulkan_panfrost.so with the project's own options.
# It does NOT mean byte-identical output (absolute build paths and the
# container's clang version differ from the author's device); byte-identity
# was proven once, on-device, and is recorded in the release notes.
name: verify-94-build

on:
  push:
    branches: [main, g57-vkmark-94]
  workflow_dispatch:

jobs:
  verify-94:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out pushed sources
        uses: actions/checkout@v4

      - name: Verify 94 source fingerprint
        run: md5sum -c .github/94-checksums.txt

      - name: Build driver inside Termux container
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/termux-out"
          chmod 777 "${{ github.workspace }}/termux-out"
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/termux-out:/termux-out" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail
              for i in 1 2 3; do
                pkg update -y && break
                echo "pkg update attempt $i failed, retrying..."
                sleep 10
              done
              pkg install -y x11-repo tur-repo
              pkg update -y || true
              pkg install -y \
                git clang lld ninja python python-pip pkg-config \
                bison flex cmake \
                vulkan-headers vulkan-loader-generic libandroid-shmem \
                libdrm libxcb xorgproto libx11 libxshmfence \
                zlib zstd libexpat libxrandr file
              pip install --break-system-packages meson mako pyyaml packaging
              cp -r /src /tmp/build-src
              cd /tmp/build-src
              meson setup build-ci \
                -Dbuildtype=release \
                -Dpanvk-use-kbase=true \
                -Dvulkan-drivers=panfrost \
                -Dgallium-drivers= \
                -Dplatforms=x11 \
                -Dglx=disabled \
                -Dbuild-tests=false \
                -Dc_link_args=-landroid-shmem \
                -Dcpp_link_args=-landroid-shmem \
                -Dpanfrost-kmds=kbase,panthor
              ninja -C build-ci -j"$(nproc)" src/panfrost/vulkan/libvulkan_panfrost.so
              cp build-ci/src/panfrost/vulkan/libvulkan_panfrost.so /termux-out/
              sha256sum /termux-out/libvulkan_panfrost.so
            '

      - name: Upload built driver
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_panfrost-ci-${{ github.sha }}
          path: termux-out/libvulkan_panfrost.so
          if-no-files-found: error
